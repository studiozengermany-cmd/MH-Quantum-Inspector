<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspector UI Design (Extracted)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* CSS RESET & FONTS */
    body {
      margin: 0; padding: 20px;
      background-color: #E5E7EB;
      background-image: radial-gradient(#D1D5DB 1px, transparent 1px);
      background-size: 20px 20px;
      font-family: 'Geist', 'Outfit', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    .shadow-host {
      --color-bg: #FFFFFF;
      --color-surface: #F7F5F2;
      --color-text-main: #0F1115;
      --color-text-muted: #6B7280;
      --color-border: rgba(15, 17, 21, 0.08);
      --color-accent: #2563EB;
      --font-ui: 'Geist', 'Outfit', system-ui, -apple-system, sans-serif;
      --font-mono: 'Geist Mono', 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; }

    #mhq-context-menu {
      position: relative !important; /* relative for standalone preview */
      width: 340px !important;
      min-height: 400px !important;
      background: var(--color-bg) !important;
      border: 1px solid var(--color-border) !important;
      border-radius: 12px !important;
      box-shadow: 0 20px 40px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04) !important;
      display: flex !important;
      flex-direction: column !important;
      font-family: var(--font-ui) !important;
      color: var(--color-text-main) !important;
      overflow: hidden !important;
      resize: both !important;
    }

    /* HEADER (DRAG HANDLE) */
    .mhq-menu-header {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding: 12px 16px !important;
      border-bottom: 1px solid var(--color-border) !important;
      background: var(--color-bg) !important;
      cursor: grab !important;
      user-select: none !important;
    }

    .mhq-brand {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      font-weight: 600 !important;
      font-size: 14px !important;
    }
    .mhq-logo-icon {
      width: 16px; height: 16px;
      border: 1.5px dashed var(--color-accent);
      border-radius: 2px;
      position: relative;
    }
    .mhq-logo-icon::after {
      content: '↖';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      color: var(--color-accent);
    }

    .mhq-menu-close {
      background: transparent !important;
      border: none !important;
      color: var(--color-text-muted) !important;
      cursor: pointer !important;
      padding: 4px !important;
      border-radius: 4px !important;
      transition: all 0.2s ease !important;
    }
    .mhq-menu-close:hover {
      background: var(--color-surface) !important;
      color: var(--color-text-main) !important;
    }

    /* TABS */
    .mhq-tabs {
      display: flex !important;
      border-bottom: 1px solid var(--color-border) !important;
      padding: 0 8px !important;
    }
    .mhq-tab {
      padding: 12px 12px !important;
      font-size: 12px !important;
      font-weight: 500 !important;
      color: var(--color-text-muted) !important;
      cursor: pointer !important;
      border-bottom: 2px solid transparent !important;
      transition: color 0.2s ease !important;
    }
    .mhq-tab:hover { color: var(--color-text-main) !important; }
    .mhq-tab.active {
      color: var(--color-accent) !important;
      border-bottom-color: var(--color-accent) !important;
    }

    /* CONTENT AREA */
    .mhq-content {
      padding: 16px !important;
      flex: 1 !important;
      overflow-y: auto !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 16px !important;
    }

    /* DOUBLE-BEZEL INPUTS & CARDS */
    .mhq-section-title {
      font-size: 10px !important;
      font-weight: 600 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.05em !important;
      color: var(--color-text-muted) !important;
      margin-bottom: 6px !important;
    }

    .mhq-input-box {
      background: var(--color-surface) !important;
      border: 1px solid var(--color-border) !important;
      border-radius: 6px !important;
      padding: 8px 12px !important;
      font-family: var(--font-mono) !important;
      font-size: 12px !important;
      color: var(--color-text-main) !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      word-break: break-all !important;
    }

    /* BOX MODEL */
    .mhq-box-model {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      font-family: var(--font-mono) !important;
      font-size: 10px !important;
      color: var(--color-text-muted) !important;
    }
    .mhq-box-layer {
      border: 1px dashed var(--color-border) !important;
      padding: 16px !important;
      position: relative !important;
      background: #fdfdfd !important;
    }
    .mhq-box-layer > span {
      position: absolute !important;
      top: 2px !important; left: 4px !important;
    }
    .mhq-box-content {
      background: #eef2ff !important;
      border: 1px solid #c7d2fe !important;
      padding: 8px 16px !important;
      color: var(--color-accent) !important;
      font-weight: 500 !important;
    }

    /* STYLES LIST (CHECKBOXES) */
    .mhq-style-row {
      display: flex !important;
      align-items: flex-start !important;
      gap: 8px !important;
      font-family: var(--font-mono) !important;
      font-size: 11px !important;
      margin-bottom: 8px !important;
    }
    .mhq-style-row input[type="checkbox"] {
      margin: 2px 0 0 0 !important;
      accent-color: var(--color-accent) !important;
    }
    .mhq-style-key { color: var(--color-text-muted) !important; }
    .mhq-style-val { color: var(--color-text-main) !important; word-break: break-all !important;}

    /* BUTTONS (HAPTIC / SPRING PHYSICS) */
    .mhq-btn {
      width: 100% !important;
      padding: 10px 16px !important;
      border-radius: 8px !important;
      border: 1px solid var(--color-border) !important;
      background: var(--color-bg) !important;
      color: var(--color-text-main) !important;
      font-family: var(--font-ui) !important;
      font-size: 13px !important;
      font-weight: 500 !important;
      cursor: pointer !important;
      transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1), background 0.2s ease !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 6px !important;
    }
    .mhq-btn:hover { background: var(--color-surface) !important; }
    .mhq-btn:active { transform: scale(0.98) !important; }

    .mhq-btn-primary {
      background: var(--color-accent) !important;
      color: #FFFFFF !important;
      border-color: transparent !important;
    }
    .mhq-btn-primary:hover { background: #1D4ED8 !important; }

    .mhq-textarea {
      width: 100% !important;
      background: var(--color-surface) !important;
      border: 1px solid var(--color-border) !important;
      border-radius: 6px !important;
      padding: 10px !important;
      font-family: var(--font-mono) !important;
      font-size: 11px !important;
      color: var(--color-text-main) !important;
      resize: vertical !important;
      min-height: 120px !important;
      outline: none !important;
    }
    .mhq-textarea:focus {
      border-color: var(--color-accent) !important;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1) !important;
    }
  </style>
</head>
<body class="shadow-host">

    <div id="mhq-context-menu">
      <!-- HEADER (DRAGGABLE) -->
      <div class="mhq-menu-header" id="mhq-drag-handle">
        <div class="mhq-brand">
          <div class="mhq-logo-icon"></div>
          MH-Quantum Inspector
        </div>
        <button class="mhq-menu-close" id="mhq-close" type="button" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <!-- TABS -->
      <div class="mhq-tabs">
        <div class="mhq-tab active" data-target="tab-selector">Selector</div>
        <div class="mhq-tab" data-target="tab-layout">Layout</div>
        <div class="mhq-tab" data-target="tab-styles">Styles</div>
        <div class="mhq-tab" data-target="tab-prompt">AI Prompt</div>
      </div>

      <!-- TAB: SELECTOR -->
      <div class="mhq-content" id="tab-selector">
        <div>
          <div class="mhq-section-title">SELECTOR</div>
          <div class="mhq-input-box">
            <span>div.header > h1</span>
            <button class="mhq-menu-close" style="padding:2px !important;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
          </div>
        </div>
        <div>
          <div class="mhq-section-title">BASIC INFO</div>
          <div class="mhq-input-box">
            Tag: h1 | ID: main-title
          </div>
        </div>
      </div>

      <!-- TAB: LAYOUT (BOX MODEL) -->
      <div class="mhq-content" id="tab-layout" style="display:none;">
        <div class="mhq-section-title">BOX MODEL</div>
        <div class="mhq-box-model">
          <div class="mhq-box-layer" style="width: 100%; border-color: #fcd34d !important; background: #fffbeb !important;">
            <span>margin</span>
            <div class="mhq-box-layer" style="border-color: #fca5a5 !important; background: #fef2f2 !important; margin-top: 10px;">
              <span>border</span>
              <div class="mhq-box-layer" style="border-color: #86efac !important; background: #f0fdf4 !important; margin-top: 10px;">
                <span>padding</span>
                <div class="mhq-box-content" style="margin-top: 10px; text-align: center;">
                  120 × 40
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- TAB: STYLES -->
      <div class="mhq-content" id="tab-styles" style="display:none;">
        <div class="mhq-section-title">COMPUTED STYLES</div>
        <div>
            <div class="mhq-style-row">
              <input type="checkbox" checked />
              <div>
                <span class="mhq-style-key">color:</span> 
                <span class="mhq-style-val">rgb(15, 17, 21);</span>
              </div>
            </div>
            <div class="mhq-style-row">
              <input type="checkbox" checked />
              <div>
                <span class="mhq-style-key">font-size:</span> 
                <span class="mhq-style-val">24px;</span>
              </div>
            </div>
        </div>
      </div>

      <!-- TAB: PROMPT -->
      <div class="mhq-content" id="tab-prompt" style="display:none;">
        <div class="mhq-section-title">GENERATED PROMPT</div>
        <textarea class="mhq-textarea" readonly>Example prompt content...</textarea>
        <button class="mhq-btn mhq-btn-primary" data-action="copy-main-prompt" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy Prompt
        </button>
      </div>
    </div>

<script>
  // Tabs logic
  const tabs = document.querySelectorAll('.mhq-tab');
  const contents = document.querySelectorAll('.mhq-content');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      contents.forEach(c => c.style.display = 'none');
      tab.classList.add('active');
      document.querySelector(`#${tab.dataset.target}`).style.display = 'flex';
    });
  });
</script>
</body>
</html>
