<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MH-Quantum Awwwards Level</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --spring: cubic-bezier(0.32, 0.72, 0, 1);
    }
    
    body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background: #F4F2EC; /* Warm editorial cream */
      display: flex; justify-content: center; align-items: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* CSS Film Grain Noise */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: 50;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
    }

    /* Outer Shell Popup */
    .popup-container {
      width: 360px; height: 600px;
      background: #FDFBF7;
      border: 1px solid rgba(0,0,0,0.04);
      border-radius: 36px;
      box-shadow: 
        0 40px 100px -20px rgba(15, 17, 21, 0.15),
        0 20px 40px -10px rgba(15, 17, 21, 0.08),
        inset 0 1px 1px rgba(255,255,255,1),
        inset 0 -1px 1px rgba(0,0,0,0.02);
      display: flex; flex-direction: column;
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    /* Soft Structuralism Logo */
    .logo-target {
      filter: drop-shadow(0 8px 16px rgba(37, 99, 235, 0.15)) drop-shadow(0 2px 4px rgba(37, 99, 235, 0.1));
    }
    .logo-cursor {
      filter: drop-shadow(2px 6px 12px rgba(0,0,0,0.25));
    }

    /* Double Bezel Architecture (Doppelrand) */
    .outer-bezel {
      background: rgba(15, 17, 21, 0.03);
      border: 1px solid rgba(15, 17, 21, 0.04);
      padding: 8px; /* p-2 */
      border-radius: 32px; /* rounded-[2rem] */
    }
    
    .inner-core {
      background: #FFFFFF;
      border-radius: 24px; /* rounded-[calc(2rem-0.5rem)] */
      box-shadow: inset 0 1px 1px rgba(255,255,255,1), 0 4px 12px -4px rgba(0,0,0,0.03);
      padding: 24px;
    }

    /* Magnetic Button & Button-in-Button Physics */
    .cta-btn {
      transition: all 0.7s var(--spring);
    }
    .cta-btn:active {
      transform: scale(0.96) translateY(2px);
    }
    .cta-icon-wrapper {
      transition: all 0.7s var(--spring);
    }
    
    .cta-primary:hover .cta-icon-wrapper {
      transform: translate(4px, -1px) scale(1.05);
      background: rgba(255,255,255,0.2);
    }
    .cta-secondary:hover .cta-icon-wrapper {
      transform: translate(4px, -1px) scale(1.05);
      background: rgba(15, 17, 21, 0.08);
    }

    /* Elegant Text Reveal */
    .reveal-up {
      animation: revealUp 1s var(--spring) forwards;
      opacity: 0; transform: translateY(16px);
    }
    @keyframes revealUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="popup-container">
    
    <!-- Top Nav Pill -->
    <div class="w-full flex justify-between items-center px-6 pt-6 pb-2 reveal-up" style="animation-delay: 0ms;">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_12px_rgba(16,185,129,0.8)]"></div>
        <span class="text-[11px] font-medium tracking-wide text-gray-500" style="font-family: 'Geist', sans-serif;">System Online</span>
      </div>
      <button class="w-8 h-8 rounded-full bg-black/5 flex items-center justify-center text-gray-400 hover:text-gray-900 transition-colors">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <!-- Editorial Canvas Area -->
    <div class="flex-1 flex flex-col justify-center items-center px-5 pb-6">
      
      <!-- Spatial Rhythm Logo -->
      <div class="flex flex-col items-center justify-center mb-10 w-full relative reveal-up" style="animation-delay: 100ms;">
        
        <div class="relative w-[100px] h-[100px] mb-8 flex justify-center items-center">
          <!-- 3D Ethereal Target -->
          <svg width="90" height="90" viewBox="0 0 100 100" fill="none" class="absolute logo-target">
            <!-- Corners -->
            <path d="M 32 12 L 12 12 L 12 32" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 68 12 L 88 12 L 88 32" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 12 68 L 12 88 L 32 88" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 88 68 L 88 88 L 68 88" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Rings -->
            <circle cx="50" cy="50" r="26" stroke="#2563EB" stroke-width="6"/>
            <!-- Crosshairs -->
            <path d="M 50 12 L 50 24 M 50 76 L 50 88 M 12 50 L 24 50 M 76 50 L 88 50" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
          </svg>
          
          <!-- Tactile Cursor -->
          <svg width="50" height="50" viewBox="0 0 24 24" fill="#0F1115" class="absolute logo-cursor" style="top: 38px; left: 38px;">
            <path d="M3 3l7 18 2.5-7.5L20 11 3 3z" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>

        <!-- High-Contrast Editorial Typography -->
        <div class="text-center">
          <h1 class="text-[34px] leading-[1.1] text-[#0F1115] mb-2" style="font-family: 'Playfair Display', serif; letter-spacing: -0.03em;">MH-Quantum</h1>
          <h2 class="text-[20px] leading-none text-[#6B7280] font-medium" style="font-family: 'Geist', sans-serif; letter-spacing: -0.01em;">Inspector</h2>
        </div>
      </div>

      <!-- The Double-Bezel Control Panel -->
      <div class="w-full outer-bezel reveal-up" style="animation-delay: 200ms;">
        <div class="inner-core flex flex-col items-center">
          
          <!-- Eyebrow Tag -->
          <span class="rounded-full px-3 py-1 text-[9px] uppercase tracking-[0.25em] font-bold text-gray-400 mb-4 bg-gray-50 border border-gray-100" style="font-family: 'Geist', sans-serif;">
            Ready State
          </span>

          <p class="text-center text-[13px] text-gray-500 mb-8 leading-relaxed" style="font-family: 'Geist', sans-serif;">
            Press <span class="bg-gray-50 text-gray-800 px-2.5 py-1 rounded-md border border-gray-200 font-mono text-[11px] font-semibold mx-1 shadow-sm">Ctrl+Shift+X</span> to activate the spatial inspector.
          </p>
          
          <div class="w-full flex flex-col gap-3">
            
            <!-- Button-in-Button CTA (Primary) -->
            <button class="cta-primary cta-btn group w-full bg-[#0F1115] text-white py-2 px-2 pl-6 rounded-full flex items-center justify-between shadow-[0_12px_24px_-8px_rgba(15,17,21,0.4)] hover:shadow-[0_16px_32px_-8px_rgba(15,17,21,0.5)] cursor-pointer">
              <span class="font-medium text-[14px] tracking-wide" style="font-family: 'Geist', sans-serif;">Start Inspecting</span>
              <div class="cta-icon-wrapper w-[38px] h-[38px] rounded-full bg-white/10 flex items-center justify-center border border-white/5">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
              </div>
            </button>

            <!-- Button-in-Button CTA (Secondary) -->
            <button class="cta-secondary cta-btn group w-full bg-transparent text-[#0F1115] py-2 px-2 pl-6 rounded-full flex items-center justify-between cursor-pointer border border-transparent hover:bg-gray-50 transition-colors">
              <span class="font-medium text-[14px]" style="font-family: 'Geist', sans-serif;">Instruction Guide</span>
              <div class="cta-icon-wrapper w-[38px] h-[38px] rounded-full bg-black/5 flex items-center justify-center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
              </div>
            </button>
            
          </div>
        </div>
      </div>
      
    </div>
  </div>

</body>
</html>
